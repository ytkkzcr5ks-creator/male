var step=0,total=12;
function beep(f,d,t){
try{var ctx=new (window.AudioContext||window.webkitAudioContext)();
var o=ctx.createOscillator(),g=ctx.createGain();
o.type=t||"square";o.frequency.value=f||700;g.gain.value=.03;
o.connect(g);g.connect(ctx.destination);o.start();
g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+(d||.06));
o.stop(ctx.currentTime+(d||.06));}catch(e){}
}
function render(id){
step++;beep(620,.05);
var q=Q[id];
var pos=Math.min(92,Math.round(step/total*100));
var h='<div class="scanline" style="left:'+pos+'%"></div>';
h+='<div class="scan">'+q.s+'</div><div class="bar"><div class="fill" style="width:'+Math.round(step/total*100)+'%"></div></div>';
h+='<div class="q">'+q.t+'</div>';
var app=document.getElementById("app");
app.innerHTML=h;
for(var i=0;i<q.a.length;i++){
var b=document.createElement("button");
b.textContent="▸ "+q.a[i][0];
b.onclick=function(type,next){return function(){beep(820,.06);S[type]++;hist.push(id);if(next==="end"){finish();}else{render(next);}};}(q.a[i][1],q.a[i][2]);
app.appendChild(b);
}
if(hist.length>0){
var back=document.createElement("button");
back.className="back";back.textContent="◂ ВЕРНУТЬСЯ К ПРЕДЫДУЩЕМУ ВОПРОСУ";
back.onclick=function(){beep(300,.08);var prev=hist.pop();step--;render(prev);};
app.appendChild(back);
}
}
