var step=0,total=10;
function render(id){
step++;
var q=Q[id];
var h='<div class="scan">'+q.s+'</div><div class="bar"><div class="fill" style="width:'+Math.round(step/total*100)+'%"></div></div>';
h+='<h2>'+q.t+'</h2>';
for(var i=0;i<q.a.length;i++){
h+='<button onclick="pick(\''+q.a[i][1]+'\',\''+q.a[i][2]+'\')">▸ '+q.a[i][0]+'</button>';
}
document.getElementById("app").innerHTML=h;
}
function pick(type,next){
S[type]++;
if(next==="end"){finish();}else{render(next);}
}
function finish(){
var best="norm";
for(var k in S){if(S[k]>S[best]){best=k;}}
var r=R[best];
var dangerText=r.d[1];
var h='<div class="scan">АНАЛИЗ ЗАВЕРШЁН. СУЩНОСТЬ ИДЕНТИФИЦИРОВАНА.</div>';
h+='<div class="klass">'+r.n+'</div>';
h+='<div class="danger '+r.d[0]+'">'+dangerText+'</div>';

h+='<div class="block"><b>КТО ОН:</b><br>'+r.desc+'</div>';
h+='<div class="block"><b>КАК С НИМ ВЗАИМОДЕЙСТВОВАТЬ:</b><br>'+r.how+'</div>';
h+='<div class="block"><b>КРАСНЫЕ ФЛАГИ:</b><ul>';
for(var i=0;i<r.flags.length;i++){h+='<li>'+r.flags[i]+'</li>';}
h+='</ul></div>';
h+='<button class="share" onclick="share()">ПОДЕЛИТЬСЯ ВЕРДИКТОМ</button>';
h+='<button onclick="location.reload()">ПРОВЕСТИ НОВЫЙ ЭКЗОРЦИЗМ</button>';
document.getElementById("app").innerHTML=h;
window.lastResult="Мой результат в «Готическом сканере мужиков»: "+r.n+" — "+dangerText+". "+r.q;
}
function share(){
var text=window.lastResult||"Я прошла «Готический сканер мужиков»!";
var url="https://ytkkzcr5ks-creator.github.io/male/";
if(navigator.share){
navigator.share({title:"Готический сканер мужиков",text:text,url:url});
}else if(navigator.clipboard){
navigator.clipboard.writeText(text+" "+url);
alert("Результат скопирован!");
}else{
prompt("Скопируй результат:",text+" "+url);
}
}
render("start");
