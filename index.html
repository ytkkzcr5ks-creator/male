function autoFilter(t){if(!t)return null;
if(/@[A-Za-z0-9_]{3,}/.test(t))return "Ники и упоминания аккаунтов публиковать нельзя.";
if(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/.test(t))return "Электронную почту публиковать нельзя.";
if(/\d{7,}/.test(t.replace(/[\s\-()]/g,"")))return "Похоже на номер телефона или другой личный номер. Убери цифры.";
if(/\b(ул\.|улица|дом \d|кв\.|квартира \d|индекс)\b/i.test(t))return "Адреса и точные места публиковать нельзя.";
return null;}
function wrapText(ctx,text,x,y,maxW,lh){var words=String(text||"").split(" "),line="",yy=y;
for(var i=0;i<words.length;i++){var test=line+words[i]+" ";
if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,x,yy);line=words[i]+" ";yy+=lh;}else line=test;}
if(line)ctx.fillText(line,x,yy);return yy+lh;}
