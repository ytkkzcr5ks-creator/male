narc:{i:"👑",n:"НАРЦИСС-АРХОНТ",d:["red","ЦИФРОВАЯ ИНКВИЗИЦИЯ / FINAL BOSS"],q:"Он не разговаривает — он проводит пресс-конференцию о собственной значимости.",desc:"Он воспринимает себя как центр истории, а других — как аудиторию. Его обаяние работает в одну сторону: ему нужно восхищение, а не равный контакт.",rec:"Разговоры постоянно возвращаются к нему. Критика воспринимается как нападение, комплименты — как должное.",ph:["«Меня просто не ценят»","«Я слишком умный для этих людей»","«Она не понимала, кого потеряла»","«Я лучше знаю, что тебе нужно»"],exp:"Сначала интенсивное восхищение, затем холод, обесценивание и дистанция.",co:"Не заслуживай уважение идеальным поведением. Веди факты: обещал — сделал. Не спорь о его значимости, обсуждай конкретные поступки. Если после общения ты регулярно чувствуешь себя виноватой, поговори с близким человеком или психологом.",fl:["Обесценивает твои чувства","Не признаёт ошибки искренне","Переводит разговор на себя","Воспринимает критику как нападение","Нуждается в восхищении"]},
