var step=0,total=10;
function beep(f,d,t){
try{var ctx=new (window.AudioContext||window.webkitAudioContext)();
var o=ctx.createOscillator(),g=ctx.createGain();
o.type=t||"square";o.frequency.value=f||700;g.gain.value=.03;
o.connect(g);g.connect(ctx.destination);o.start();
g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+(d||.06));
o.stop(ctx.currentTime+(d||.06));}catch(e){}
}
function render(id){
step++;beep(620,.05);
var q=Q[id];
var h='<div class="scan">'+q.s+'</div><div class="bar"><div class="fill" style="width:'+Math.round(step/total*100)+'%"></div></div><div class="q">'+q.t+'</div>';
for(var i=0;i<q.a.length;i++){h+='<button onclick="pick(\''+q.a[i][1]+'\',\''+q.a[i][2]+'\')">▸ '+q.a[i][0]+'</button>';}
document.getElementById("app").innerHTML=h;
}
function pick(type,next){
beep(820,.06);S[type]++;
if(next==="end"){finish();}else{render(next);}
}
function finish(){
beep(220,.25,"sawtooth");
var redScore=S.narc+S.covert+S.gas+S.manip+S.ctrl;
var best="norm";
var maxBad=-1;
var keys=["narc","covert","gas","manip","pickme","chaos","norm","ctrl"];
for(var i=0;i<keys.length;i++){var k=keys[i];if(S[k]>maxBad){maxBad=S[k];best=k;}}
if(S.green>=4&&redScore<=2){best="green";}
var r=R[best];
var isGreen=(best==="green");
var flagTitle=isGreen?"🟢 ЗЕЛЁНЫЕ ФЛАГИ":"🔴 КРАСНЫЕ ФЛАГИ";
var flagClass=isGreen?"green":"red";
var names={narc:"Нарцисс-Архонт",covert:"Скрытый нарцисс",gas:"Газлайт-Гоблин",manip:"Манипулятор",pickme:"Пикми-Вампир",chaos:"Хаос-Агент",norm:"Нормис",green:"Зелёный флаг",ctrl:"Контролёр"};
var classes={narc:"red",covert:"red",gas:"red",manip:"red",pickme:"purple",chaos:"yellow",norm:"safe",green:"safe",ctrl:"red"};
var maxScore=Math.max(1,S.narc,S.covert,S.gas,S.manip,S.pickme,S.chaos,S.norm,S.green,S.ctrl);
var h='<div class="scan">АНАЛИЗ ЗАВЕРШЁН. СУЩНОСТЬ ИДЕНТИФИЦИРОВАНА.</div>';
h+='<div class="klass">'+r.n+'</div>';
h+='<div class="danger '+r.d[0]+'">'+r.d[1]+'</div>';
h+='<div class="quote">«'+r.q+'»</div>';
h+='<div class="block"><b>КТО ОН:</b><br>'+r.desc+'</div>';
h+='<div class="block"><b>КАК ЕГО РАСПОЗНАТЬ:</b><br>'+r.recognize+'</div>';
h+='<div class="block red"><b>ФРАЗЫ-МАРКЕРЫ:</b><ul class="redflags">';
for(var i=0;i<r.phrases.length;i++){h+='<li>'+r.phrases[i]+'</li>';}
h+='</ul></div>';
h+='<div class="block"><b>ЧЕГО ЖДАТЬ:</b><br>'+r.expect+'</div>';
h+='<div class="block"><b>КАК С НИМ ВЗАИМОДЕЙСТВОВАТЬ:</b><br>'+r.dont+'</div>';
h+='<div class="block"><b>ПРОФИЛЬ СОВМЕСТИМОСТИ С КАСТАМИ:</b>';
for(var j=0;j<keys.length;j++){
var k2=keys[j];var pct=Math.round(S[k2]/maxScore*100);
h+='<div class="stat '+classes[k2]+'"><div class="name"><span>'+names[k2]+'</span><span>'+pct+'%</span></div><div class="track"><div class="val" style="width:'+pct+'%"></div></div></div>';
}
h+='</div>';
h+='<div class="block '+flagClass+'"><b>'+flagTitle+':</b><ul class="'+(isGreen?'greenflags':'redflags')+'">';
for(var m=0;m<r.flags.length;m++){h+='<li>'+r.flags[m]+'</li>';}
h+='</ul>';
if(!isGreen){h+='<div class="lamps">🔴 Чем больше таких лампочек совпало с реальностью — тем внимательнее к границам.</div>';}
h+='</div>';
h+='<button class="share" onclick="share()">☾ ПОДЕЛИТЬСЯ ВЕРДИКТОМ ☾</button>';
h+='<button class="again" onclick="restart()">☠ ПРОВЕСТИ НОВЫЙ ЭКЗОРЦИЗМ ☠</button>';
document.getElementById("app").innerHTML=h;
window.lastResult="Мой результат в «Готическом сканере мужиков»: "+r.n+" — "+r.d[1]+". "+r.q;
}
function restart(){
beep(180,.2,"sawtooth");
step=0;
for(var k in S){S[k]=0;}
render("start");
}
function share(){
beep(900,.08);
var text=window.lastResult||"Я прошла «Готический сканер мужиков»!";
var url="https://ytkkzcr5ks-creator.github.io/male/";
if(navigator.share){navigator.share({title:"Готический сканер мужиков",text:text,url:url});}
else if(navigator.clipboard){navigator.clipboard.writeText(text+" "+url);alert("Результат скопирован!");}
else{prompt("Скопируй результат:",text+" "+url);}
}
function portal(){

p.style.opacity="1";beep(140,.5,"sawtooth");
setTimeout(function(){p.style.opacity="0";},650);
}

setTimeout(function(){step=0;for(var k in S){S[k]=0;}render("start");},500);
}

resize();addEventListener("resize",resize);
var chars="01АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЭЮЯ☠✝⚔";
setInterval(function(){
x.fillStyle="rgba(4,5,6,.09)";x.fillRect(0,0,c.width,c.height);
x.font="15px monospace";
for(var i=0;i<cols;i++){
var y=drops[i]*16;
x.fillStyle=Math.random()>.97?"#ff3b5c":"#39ff88";
