}
function pick(type,next){
beep(820,.06);
S[type]++;
if(next==="end"){finish();}else{render(next);}
}
function finish(){
beep(220,.25,"sawtooth");
var best="norm";
for(var k in S){if(S[k]>S[best]){best=k;}}
var r=R[best];
var flagTitle=(best==="green")?"ЗЕЛЁНЫЕ ФЛАГИ":"КРАСНЫЕ ФЛАГИ";
var h='<div class="scan">АНАЛИЗ ЗАВЕРШЁН. СУЩНОСТЬ ИДЕНТИФИЦИРОВАНА.</div>';
h+='<div class="klass">☠ '+r.n+' ☠</div>';
h+='<div class="danger '+r.d[0]+'">'+r.d[1]+'</div>';
h+='<div class="quote">«'+r.q+'»</div>';
h+='<div class="block"><b>КТО ОН:</b><br>'+r.desc+'</div>';
h+='<div class="block"><b>КАК С НИМ ВЗАИМОДЕЙСТВОВАТЬ:</b><br>'+r.how+'</div>';
h+='<div class="block"><b>'+flagTitle+':</b><ul>';
for(var i=0;i<r.flags.length;i++){h+='<li>'+r.flags[i]+'</li>';}
h+='</ul></div>';
h+='<button class="share" onclick="share()">☾ ПОДЕЛИТЬСЯ ВЕРДИКТОМ ☾</button>';
h+='<button class="again" onclick="location.reload()">☠ ПРОВЕСТИ НОВЫЙ ЭКЗОРЦИЗМ ☠</button>';
document.getElementById("app").innerHTML=h;
window.lastResult="Мой результат в «Готическом сканере мужиков»: "+r.n+" — "+r.d[1]+". "+r.q;
}
function share(){
beep(900,.08);
var text=window.lastResult||"Я прошла «Готический сканер мужиков»!";
var url="https://ytkkzcr5ks-creator.github.io/male/";
if(navigator.share){navigator.share({title:"Готический сканер мужиков",text:text,url:url});}
else if(navigator.clipboard){navigator.clipboard.writeText(text+" "+url);alert("Результат скопирован!");}
else{prompt("Скопируй результат:",text+" "+url);}
}
function portal(){
var p=document.getElementById("portal");
p.style.opacity="1";beep(140,.5,"sawtooth");
setTimeout(function(){p.style.opacity="0";},650);
}
function startQuiz(){
portal();
setTimeout(function(){
step=0;
for(var k in S){S[k]=0;}
render("start");
},500);
}
function refuse(){
beep(180,.18,"sawtooth");
document.getElementById("introq").innerHTML='<div class="bigq">СКАНЕР УВАЖАЕТ ТВОЁ РЕШЕНИЕ.<br>НО МУЖИКИ ВСЁ РАВНО СУЩЕСТВУЮТ.</div><button class="yes" onclick="startQuiz()">ЛАДНО, ВСЁ ТАКИ ДА</button><button class="no" onclick="location.reload()">ЗАКРЫТЬ ПОРТАЛ</button>';
}
