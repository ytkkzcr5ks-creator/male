pickme:{n:"ПИКМИ-ВАМПИР",d:["pur","HIGH DRAMA"],q:"Влюбляется быстро, исчезает красиво, возвращается с цитатой.",desc:"Он влюбляется в внимание и драму, а не в реального человека.",rec:"Быстрая идеализация, огромные обещания, потом исчезновение.",ph:["«Ты не такая, как все»","«Я никогда так не привязывался»","«Я изменился, дай шанс»"],exp:"Горячо-холодные качели.",co:"Не спасай и не доказывай, что ты особенная. Проверяй не слова, а простые договорённости. Если после возвращения легко, а потом тревожно — это паттерн.",fl:["Быстрая идеализация","Горячо-холодные качели","Драматичные исчезновения","Обещания без действий"]},
chaos:{n:"ХАОС-АГЕНТ",d:["yel","MID CRINGE"],q:"Плана нет. Вайб есть.",desc:"Живёт в режиме «разберёмся на месте».",rec:"Появляется, когда удобно, исчезает без объяснений.",ph:["«Давай посмотрим, как пойдёт»","«Само наладится»","«Ты считала дни?»"],exp:"Сорванные планы и непредсказуемость.",co:"Не переделывай хаос в надёжность. Если тебе важны стабильность и ясность — это критерий совместимости, а не «слишком много требований».",fl:["Срывает договорённости","Нет планов","«Само наладится»","Эмоциональные качели"]},

green:{n:"ЗЕЛЁНЫЙ ФЛАГ",d:["grn","SAFE MODE"],q:"Уважает границы, слышит и умеет извиняться.",desc:"Он не превращает близость в войну за власть.",rec:"Спрашивает, как ты, не наказывает молчанием, уважает «нет».",ph:["«Что тебя задело?»","«Я был неправ, извини»","«Что тебе комфортнее?»"],exp:"Спокойствие, последовательность, уважение.",co:"Береги, но не превращай в спасителя. Продолжай говорить о потребностях и границах.",fl:["Признаёт ошибки","Уважает «нет»","Не давит","Не исчезает"]},

function beep(f,d,t){try{var c=new(window.AudioContext||window.webkitAudioContext)();var o=c.createOscillator(),g=c.createGain();o.type=t||"square";o.frequency.value=f;g.gain.value=.03;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.stop(c.currentTime+d);}catch(e){}}

for(var i=0;i<q.a.length;i++){(function(it){var b=document.createElement("button");b.textContent="▸ "+it[0];b.onclick=function(){beep(820,.06);S[it[1]]++;hist.push(id);if(id==="q12"){finish();}else{render("q"+(order.indexOf(id)+2));}};a.appendChild(b);})(q.a[i]);}

function finish(){beep(220,.25,"sawtooth");var red=S.narc+S.covert+S.gas+S.manip+S.ctrl,best="norm",mx=-1,ks=["narc","covert","gas","manip","pickme","chaos","norm","ctrl"];

var r=R[best],isG=best==="green",ti=isG?"🟢 ЗЕЛЁНЫЕ ФЛАГИ":"🔴 КРАСНЫЕ ФЛАГИ";
var nm={narc:"Нарцисс-Архонт",covert:"Скрытый нарцисс",gas:"Газлайт-Гоблин",manip:"Манипулятор",pickme:"Пикми-Вампир",chaos:"Хаос-Агент",norm:"Нормис",green:"Зелёный флаг",ctrl:"Контролёр"};

window.res="Мой результат: "+r.n+" — "+r.d[1]+". "+r.q;window.ty=best;}
